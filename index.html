<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="cloud.css">
</head>
<body>
    <div class="container">
 
       
        <header>
            <h1>Weather Dashboard</h1>
            <button id="themeBtn" type="button">🌙 Dark</button>
        </header>
 
        
        <form class="search" id="searchForm">
            <input id="cityInput" type="text" placeholder="Enter city name..." autocomplete="off">
            <button id="searchBtn" type="submit">Search Weather</button>
        </form>
 
        
        <div id="loader">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
 
       
        <div id="errorMsg" class="error"></div>
 
       
        <div id="weatherCard" class="card" style="display: none;"></div>
 
        
        <section id="forecastList"></section>
 
       
        <section class="favorite">
            <h3>Favorites</h3>
            <div id="favoriteList"></div>
        </section>
 
    </div>
 
    <script src="cloud.js"></script>
</body>
</html>
